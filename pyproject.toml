[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmars-simulation"
version = "0.1.0"
description = "Phase 2 discrete-event PMARS satellite scheduling simulation"
requires-python = ">=3.11"
dependencies = ["simpy==4.1.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["pmars_simulation*"]
